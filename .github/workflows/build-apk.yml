name: Build Debug APK and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"

          if [ -z "${JAVA_HOME:-}" ]; then
            echo "::error::JAVA_HOME is not set."
            exit 1
          fi

          VERSION_OUTPUT="$(java -version 2>&1 | head -n 1)"
          echo "Detected Java version line: ${VERSION_OUTPUT}"

          RAW_VERSION="$(echo "${VERSION_OUTPUT}" | sed -nE 's/.*version "([^"]+)".*/\1/p')"
          if [ -z "${RAW_VERSION}" ]; then
            echo "::error::Unable to detect the active Java version."
            exit 1
          fi

          if [[ "${RAW_VERSION}" == 1.* ]]; then
            MAJOR_VERSION="$(echo "${RAW_VERSION}" | cut -d'.' -f2)"
          else
            MAJOR_VERSION="$(echo "${RAW_VERSION}" | cut -d'.' -f1 | cut -d'-' -f1)"
          fi

          if ! [[ "${MAJOR_VERSION}" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to parse numeric Java major version from '${RAW_VERSION}'."
            exit 1
          fi

          echo "Detected Java major version: ${MAJOR_VERSION}"
          if [ "${MAJOR_VERSION}" -lt 17 ]; then
            echo "::error::Active Java major version (${MAJOR_VERSION}) is lower than 17."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="./debug.keystore"

          if [ -f "${KEYSTORE_PATH}" ]; then
            echo "Temporary debug keystore already exists at ${KEYSTORE_PATH}."
          else
            echo "Generating temporary debug keystore at ${KEYSTORE_PATH}..."
            "${JAVA_HOME}/bin/keytool" -genkeypair -v \
              -keystore "${KEYSTORE_PATH}" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt > /dev/null 2>&1
          fi

          if [ ! -f "${KEYSTORE_PATH}" ] || [ ! -s "${KEYSTORE_PATH}" ]; then
            echo "::error::Failed to create temporary debug keystore at ${KEYSTORE_PATH}."
            exit 1
          fi

          echo "Confirmed temporary debug keystore exists at ${KEYSTORE_PATH}."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        id: verify_apk
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -e "${EXPECTED_APK}" ]; then
            echo "::error::Expected debug APK was not found at ${EXPECTED_APK}."
            if [ -d "app/build/outputs/apk" ]; then
              echo "Searching inside app/build/outputs/apk for discovered APK paths:"
              find "app/build/outputs/apk" -type f -name "*.apk" -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "::error::${EXPECTED_APK} exists but is not a regular file."
            exit 1
          fi

          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "::error::${EXPECTED_APK} is empty."
            exit 1
          fi

          case "${EXPECTED_APK}" in
            *.apk) ;;
            *)
              echo "::error::${EXPECTED_APK} does not have the .apk extension."
              exit 1
              ;;
          esac

          if [ "${EXPECTED_APK}" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::Selected APK path (${EXPECTED_APK}) does not match app/build/outputs/apk/debug/app-debug.apk."
            exit 1
          fi

          echo "Verified debug APK at ${EXPECTED_APK}."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "${SOURCE_APK}" ] || [ ! -s "${SOURCE_APK}" ]; then
            echo "::error::Verified source APK is missing or empty at ${SOURCE_APK}."
            exit 1
          fi

          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_REPO_NAME="$(echo "${RAW_REPO_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [ -z "${SANITIZED_REPO_NAME}" ]; then
            SANITIZED_REPO_NAME="android-app"
          fi

          RELEASE_ASSET_NAME="${SANITIZED_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          RELEASE_STAGE_DIR="$(mktemp -d "${RUNNER_TEMP}/apk-release-asset.XXXXXX")"
          RELEASE_ASSET_PATH="${RELEASE_STAGE_DIR}/${RELEASE_ASSET_NAME}"

          cp "${SOURCE_APK}" "${RELEASE_ASSET_PATH}"

          if [ ! -f "${RELEASE_ASSET_PATH}" ] || [ ! -s "${RELEASE_ASSET_PATH}" ]; then
            echo "::error::Prepared release asset is missing or empty at ${RELEASE_ASSET_PATH}."
            exit 1
          fi

          echo "asset_path=${RELEASE_ASSET_PATH}" >> "${GITHUB_OUTPUT}"
          echo "asset_name=${RELEASE_ASSET_NAME}" >> "${GITHUB_OUTPUT}"
          echo "Prepared release asset: ${RELEASE_ASSET_NAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          RELEASE_ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail

          gh --version

          if [ -z "${RELEASE_ASSET_PATH}" ] || [ ! -f "${RELEASE_ASSET_PATH}" ] || [ ! -s "${RELEASE_ASSET_PATH}" ]; then
            echo "::warning::Prepared release asset does not exist or is empty at '${RELEASE_ASSET_PATH}'."
            exit 1
          fi

          case "${RELEASE_ASSET_PATH}" in
            *.apk) ;;
            *)
              echo "::warning::Prepared release asset '${RELEASE_ASSET_PATH}' is not a .apk file."
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES_FILE="$(mktemp "${RUNNER_TEMP}/release-notes.XXXXXX.md")"
          cat <<EOF > "${NOTES_FILE}"
          ### Automated Debug APK Build

          - **Build Type:** Automatically generated debug APK
          - **Built By:** GitHub Actions
          - **Workflow Run Number:** ${GITHUB_RUN_NUMBER}
          - **Workflow Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}
          - **Purpose:** Intended for testing only
          - **Release Status:** Not a Play Store production release
          - **Signing:** Signed only with a temporary debug keystore generated during the workflow run
          EOF

          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "title=${RELEASE_TITLE}" >> "${GITHUB_OUTPUT}"

          gh release create "${RELEASE_TAG}" "${RELEASE_ASSET_PATH}" \
            --title "${RELEASE_TITLE}" \
            --notes-file "${NOTES_FILE}" \
            --target "${GITHUB_SHA}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_TAG: debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}
          RELEASE_TITLE: Debug APK Build #${{ github.run_number }}
          RELEASE_ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${PUBLISH_OUTCOME}" = "success" ] && RELEASE_URL="$(gh release view "${RELEASE_TAG}" --json url --jq '.url' 2>/dev/null)" && [ -n "${RELEASE_URL}" ]; then
            echo "GitHub Release published successfully."
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release Page URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${RELEASE_ASSET_NAME}"

            {
              echo "## Debug APK Build & Release Summary"
              echo ""
              echo "- **APK Build Status:** Succeeded"
              echo "- **Actions Artifact:** \`app-debug-apk\` (available as a backup in this workflow run)"
              echo "- **GitHub Release Status:** Published"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **APK Asset Filename:** \`${RELEASE_ASSET_NAME}\`"
              echo "- **Direct Release Page URL:** ${RELEASE_URL}"
              echo ""
              echo "You can download the APK directly on your phone from the **Assets** section of the GitHub Release page above. The normal GitHub Actions artifact (\`app-debug-apk\`) is also available as a backup."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::GitHub Release publishing failed. The debug APK build succeeded and the Actions artifact named 'app-debug-apk' remains available for download."

            {
              echo "## Debug APK Build & Release Summary"
              echo ""
              echo "> [!WARNING]"
              echo "> GitHub Release publishing did not succeed, but the debug APK build and artifact upload completed."
              echo ""
              echo "- **APK Build Status:** Succeeded"
              echo "- **Actions Artifact:** \`app-debug-apk\` remains available in the workflow run summary"
              echo "- **GitHub Release Status:** Failed"
              echo ""
              echo "Download the APK from the **Artifacts** section of this workflow run using the \`app-debug-apk\` artifact."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
